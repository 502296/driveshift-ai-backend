<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>DriveShift · Password recovery</title><link rel="stylesheet" href="/admin/style.css"><script src="/admin/recovery.js" defer></script></head><body><main><header><div class="brand">DriveShift<span>ADMINISTRATION</span></div></header><section><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password.</h1><form id="request-form"><label>Email<input id="email" type="email" autocomplete="username" required></label><button id="send" disabled>Send recovery email</button></form><form id="password-form" hidden><label>New password<input id="password" type="password" autocomplete="new-password" minlength="12" required></label><label>Confirm password<input id="confirm" type="password" autocomplete="new-password" minlength="12" required></label><button id="save" disabled>Save new password</button></form><p id="message" role="status" aria-live="polite"></p><p><a href="/admin/index.html">Return to sign in</a></p></section></main></body></html>
